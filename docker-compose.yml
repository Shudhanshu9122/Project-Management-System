services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pms
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d pms']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    # The schema is idempotent, so applying it on every start is safe and keeps
    # a fresh volume usable without a manual step.
    command: sh -c "node src/scripts/migrate.js && node src/server.js"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/pms
      JWT_SECRET: compose-only-secret-change-me-please-32-chars
      JWT_EXPIRES_IN: 7d
      CORS_ORIGINS: http://localhost:5173
      TRUST_PROXY: 'false'
      LOG_LEVEL: info
    ports:
      - '4000:4000'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'node -e "fetch(\\"http://127.0.0.1:4000/health\\").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"']
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./web
      args:
        # Baked in at build time: this is how the containerised bundle finds the
        # API from the browser, which runs on the host.
        VITE_API_URL: http://localhost:4000/api
    ports:
      - '5173:80'
    depends_on:
      - backend

volumes:
  pgdata:
